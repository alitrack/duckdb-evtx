[package]
name = "duckdb-evtx"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "DuckDB loadable extension: Windows Event Log (.evtx) file inspection — record count + validity probe, in SQL"

[lib]
# Named `evtx` so the cdylib is `libevtx.so`, matching the Makefile's
# `EXTENSION_LIB_FILENAME` (derived from `EXTENSION_NAME`). Inside `mod
# evtx_parse`, `use evtx::EvtxParser` resolves against the extern prelude (the
# `evtx` *dependency*), not this crate — no collision.
name = "evtx"
path = "src/lib.rs"
crate-type = ["cdylib"]

# Packaging tool (copied from quack-rs, std-only): stamps the 534-byte DuckDB
# extension metadata footer onto the built cdylib to produce the loadable
# .duckdb_extension. `cargo run --bin append_metadata`.
[[bin]]
name = "append_metadata"
path = "src-bin/append_metadata/main.rs"

[dependencies]
# quack-rs — pure-Rust wrapper over DuckDB's C Extension API (crates.io).
# 0.18.0 is the version this code was written and tested against; pinned
# exactly so the reviewed ABI-wrapper version can never float under a caret
# requirement.
quack-rs = "=0.18.0"
# C extension API headers/symbols; the cdylib resolves them against the host
# DuckDB process at LOAD time.
libduckdb-sys = { version = "1.10504", features = ["loadable-extension"] }

# Engine (src/evtx_parse.rs, verbatim from the Query-farm vgi-evtx
# evtx-worker, MIT): a pure-compute Windows Event Log (.evtx) record counter +
# validity probe over an in-memory buffer. It builds on the upstream `evtx`
# parser crate (0.13, `default-features = false`) — a real external dependency,
# so this extension is not dependency-free like bgp.
evtx = { version = "0.13", default-features = false }
serde_json = "1"

[dev-dependencies]
# SQL-level integration tests: InMemoryDb compiles a real bundled DuckDB so the
# built .duckdb_extension can be LOADed inside `cargo test`.
#
# The 1.1050x line bundles a C++11-compatible DuckDB source tree that quack-rs
# compiles with `-std=c++11`. A floating `duckdb = "1.1.0"` would resolve to a
# newer minor that bundles C++17 and fails that build. `libduckdb-sys` must
# stay on the 1.1050x line.
quack-rs = { version = "=0.18.0", features = ["bundled-test"] }
duckdb = { version = "=1.10506.0", features = ["bundled"] }

[profile.release]
# `unwind`, not `abort`: every callback is wrapped in quack-rs's
# panic-safe `*_callback!` macros (catch_unwind -> set_error), so a panic in
# extension code becomes a DuckDB error instead of aborting the host process.
panic = "unwind"
lto = true
codegen-units = 1
opt-level = 3
strip = true
